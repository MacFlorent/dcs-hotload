name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests and luacheck (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lua 5.1 is the DCS mission runtime. The tests read real folders through LuaFileSystem, as
      # hotload does in DCS; luarocks is told 5.1 because apt's luarocks targets another version.
      - name: Install Lua 5.1 and LuaFileSystem
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luafilesystem

      - name: Tests
        run: lua5.1 test/run.lua

      - name: Tests of the plugin's setup script
        run: python3 -m unittest discover -s test/python

      # The pinned luacheck binary, the same one a local run uses.
      - name: luacheck
        run: bash .github/scripts/lint.sh

      # The repository is a Claude Code plugin; a broken manifest would break every install.
      - name: Validate the Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      # The plugin is the release: its version and the tag its marketplace entry installs from
      # follow Hotload.version, all three changed by the release pull request (CONTRIBUTING.md).
      - name: Plugin version and marketplace pin match Hotload.version
        run: |
          python3 - <<'EOF'
          import json, re, sys
          code = re.search(r'^Hotload\.version = "([^"]+)"', open("dcs-hotload.lua").read(), re.M).group(1)
          plugin = json.load(open(".claude-plugin/plugin.json")).get("version")
          refs = [p["source"].get("ref") for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]]
          problems = []
          if plugin != code:
              problems.append(f"plugin.json version {plugin} is not Hotload.version {code}")
          if refs != [f"v{code}"]:
              problems.append(f"marketplace.json pins {refs}, not v{code}")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          EOF

      - name: ShellCheck
        run: shellcheck bin/hotload.sh .github/scripts/package.sh .github/scripts/lint.sh

      # Builds the zip a release would publish, so a broken package shows before any tag.
      - name: Package
        run: |
          bash .github/scripts/package.sh
          zipinfo dist/dcs-hotload-*.zip | grep -E '^-rwxr-xr-x .* dcs-hotload/bin/hotload\.sh$'
