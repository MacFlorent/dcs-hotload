name: Release

# A v<x.y.z> tag publishes a GitHub release; a manual run builds the zip only, as a workflow
# artifact, to check the package before tagging. CONTRIBUTING.md says how a release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, so the tagged commit can be checked against origin/main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version and checks
        id: version
        run: |
          code_version=$(sed -n 's/^Hotload\.version = "\([^"]*\)".*/\1/p' dcs-hotload.lua)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$code_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Hotload.version $code_version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          else
            version="$code_version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/package.sh "$VERSION"
          if [ ! -f dist/notes.md ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::CHANGELOG.md has no [$VERSION] section"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no [$VERSION] section yet: expected before the release pull request"
          fi

      # Uploaded as is (archive: false), so the download is the release zip itself, named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dcs-hotload-${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" "dist/dcs-hotload-$VERSION.zip"
          --verify-tag --title "dcs-hotload $VERSION" --notes-file dist/notes.md
